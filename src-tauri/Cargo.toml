[package]
name = "spending-tracker"
version = "0.8.2"
description = "Spare — pay-period budgeting for macOS"
authors = ["Richard Davies"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "spending_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tokio = { version = "1", features = ["time"] }


# Keep the dev build cache small. Full debug symbols for Tauri's ~500-crate
# dependency tree were the bulk of a 6 GB target/ directory.
#   debug = 1      line tables only — panics still give file:line, but no
#                  variable inspection in a debugger (we don't use one)
#   incremental    off — this cache alone was ~1 GB and mostly churn
[profile.dev]
debug = 1
incremental = false
